services:
  - type: web
    name: music-study
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: RATE_LIMIT_PER_MIN
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: music-study-db
          property: connectionString
databases:
  - name: music-study-db
    plan: starter
