<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUSIC STUDY v19 CLOUD WORLD</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#edf6ff,#fff4ef);color:#172033}main{max-width:920px;margin:auto;padding:16px}.card{background:#fff;border-radius:24px;padding:20px;margin:12px 0;box-shadow:0 10px 32px #17203316}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}input,textarea,button{width:100%;box-sizing:border-box;padding:12px;border-radius:13px;border:1px solid #d5dce8;font-size:16px}textarea{min-height:110px}button{background:#172033;color:#fff;border:0;font-weight:700}.ghost{background:#edf1f7;color:#172033}.nav{display:flex;gap:7px;overflow:auto}.nav button{white-space:nowrap}.page{display:none}.active{display:block}.avatar{font-size:64px}.tag{display:inline-block;background:#eef1ff;border-radius:99px;padding:5px 9px;margin:3px}.panel{background:#f6f8fb;border-radius:14px;padding:12px;margin:8px 0}.muted{color:#667085}.bar{height:12px;background:#e8edf5;border-radius:99px;overflow:hidden}.fill{height:100%;background:#172033}.score{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.score div{padding:9px;background:#f4f6fa;border-radius:10px;text-align:center}.hidden{display:none}.ok{color:#067647}.bad{color:#b42318}
</style></head><body><main>
<div class="card"><div class="muted">🎵 MUSIC STUDY</div><h1>先生を育てる。自分も強くなる。</h1><div class="tag">BETA v23</div><p>v22 POSTGRES NATIVE — 同じ先生をどこからでも安全に続ける</p><div id="status"></div></div>
<div id="auth" class="card"><h2>☁️ アカウント</h2><div class="row"><input id="email" placeholder="メールアドレス"><input id="pw" type="password" placeholder="パスワード（10文字以上）"></div><div class="row"><button onclick="signup()">新規登録</button><button class="ghost" onclick="login()">ログイン</button></div></div>
<div id="app" class="hidden">
<div class="card"><div class="nav"><button onclick="show('home')">🏠 HOME</button><button onclick="show('study')">📚 学習</button><button onclick="show('school')">🏫 学校</button><button onclick="show('cup')">🏆 CUP</button><button class="ghost" onclick="logout()">ログアウト</button></div></div>
<section id="home" class="page active"><div class="card"><h2>🧑‍🏫 あなたの先生</h2><div class="row"><div><div id="avatar" class="avatar">🧑‍🏫</div><h2 id="name">先生</h2><p id="title" class="muted"></p></div><div><p>Lv.<b id="lv">1</b>　⭐<b id="xp">0</b> XP</p><div class="bar"><div id="fill" class="fill" style="width:0%"></div></div><p id="dna"></p><p id="traits"></p></div></div></div>
<div class="card"><h2>🎵 音楽から先生を誕生させる</h2><div class="row"><input id="song" placeholder="曲名"><input id="artist" placeholder="アーティスト"></div><textarea id="reason" placeholder="なぜこの曲が好き？"></textarea><input id="subject" placeholder="教科・テーマ"><button onclick="birth()">🥚 先生を誕生させる</button></div></section>
<section id="study" class="page"><div class="card"><h2>📚 学習</h2><p id="question" class="muted"></p><textarea id="answer" placeholder="自分の考えを書こう"></textarea><button onclick="study()">⚔️ 一歩反論</button><div id="studyResult"></div></div><div class="card"><h2>🧠 記憶</h2><div id="memory"></div></div></section>
<section id="school" class="page"><div class="card"><h2>🏫 先生の学校</h2><p class="muted">4人の先生が同じ議題を専門別に考えます。</p><input id="topic" value="AIによる診断支援を医療でどこまで利用すべきか？"><button onclick="conference()">⚔️ AIカンファレンス</button><div id="conf"></div></div><div class="card"><h2>🗣️ あなたの番</h2><textarea id="confAnswer" placeholder="先生たちの意見を踏まえて、あなたの立場とその弱点を書いてください"></textarea><button onclick="conferenceAnswer()">自分の反論を提出</button><div id="confResult"></div></div></section>
<section id="cup" class="page"><div class="card"><h2>🏆 MUSIC STUDY CUP</h2><textarea id="cupAnswer" placeholder="大会答案：立場・根拠・反論・条件まで書こう"></textarea><button onclick="cup()">予選に挑戦</button><div id="cupResult"></div></div></section>
</div></main>
<script>
const $=id=>document.getElementById(id);let teacher=null,lastConference=null;
async function api(u,o={}){let r=await fetch(u,{headers:{"Content-Type":"application/json","X-Requested-With":"MUSIC-STUDY"},...o}),j=await r.json();if(!r.ok)throw Error(j.error||"エラー");return j}
function msg(x,ok=false){$("status").textContent=x;$("status").className=ok?"ok":"bad"}
function show(id){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}
function lev(x){return x>=900?5:x>=500?4:x>=250?3:x>=100?2:1}
function evolution(d){let s=new Set(d||[]);if(s.has("反論型")&&s.has("採点者型"))return["⚖️","厳格な論客"];if(s.has("深掘り型")&&s.has("根拠重視"))return["🔬","研究者"];if(s.has("対話型")&&s.has("深掘り型"))return["🧑‍🏫","対話探究家"];if(s.has("反論型"))return["🥋","反論トレーナー"];return["🧑‍🏫","伴走先生"]}
function render(){if(!teacher)return;$("name").textContent=teacher.name;$("title").textContent=teacher.title;$("lv").textContent=teacher.level;$("xp").textContent=teacher.xp;$("dna").innerHTML=(teacher.dna||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("");$("traits").textContent="人格成長："+JSON.stringify(teacher.traits||{});let e=evolution(teacher.dna);$("avatar").textContent=e[0];let min=[0,100,250,500,900][teacher.level-1]||0,max=[100,250,500,900,900][teacher.level-1]||900;$("fill").style.width=(teacher.level===5?100:Math.min(100,Math.max(0,(teacher.xp-min)/(max-min)*100)))+"%";$("question").textContent=teacher.firstQuestion||"なぜそう考えるのか説明してみて。";$("memory").innerHTML=(teacher.memory||[]).slice(0,10).map(x=>`<div class="panel">📌 ${esc(x.summary||x)}</div>`).join("")||"まだ記憶はありません。"}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function boot(){let m=await api("/api/me");$("auth").classList.toggle("hidden",m.authenticated);$("app").classList.toggle("hidden",!m.authenticated);if(m.authenticated){teacher=m.teacher;render()}}
async function signup(){try{await api("/api/signup",{method:"POST",body:JSON.stringify({email:$("email").value,password:$("pw").value})});msg("登録しました",true);boot()}catch(e){msg(e.message)}}
async function login(){try{await api("/api/login",{method:"POST",body:JSON.stringify({email:$("email").value,password:$("pw").value})});msg("ログインしました",true);boot()}catch(e){msg(e.message)}}
async function logout(){await api("/api/logout",{method:"POST"});teacher=null;boot();msg("ログアウトしました")}
async function save(){await api("/api/teacher",{method:"PUT",body:JSON.stringify({teacher})})}
async function birth(){try{let song=$("song").value.trim(),artist=$("artist").value.trim(),reason=$("reason").value.trim(),sub=$("subject").value.trim();if(!song||!artist||!reason)return msg("曲名・アーティスト・理由を入力してください");teacher={name:["ソラ","カイ","ミナ","ユウ","ノア","レイ"][Math.floor(Math.random()*6)],title:(sub||"学問")+"の伴走先生",personality:"根拠を確かめ、問い返し、最後に一歩反論する先生",xp:20,level:1,dna:["対話型"],memory:[{summary:`${song} / ${artist}から誕生。好きな理由：${reason.slice(0,100)}`}],traits:{deepDive:0,counter:0,evidence:0,strict:0},firstQuestion:`${sub||"このテーマ"}について、なぜそう考えるのか説明してみて。`};if(reason.length>=80)teacher.dna.push("深掘り型");if(/反論|しかし|一方|ただし/.test(reason))teacher.dna.push("反論型");await save();render();msg("先生がクラウドに誕生しました",true)}catch(e){msg(e.message)}}
async function study(){try{let a=$("answer").value.trim();if(!a)return msg("回答を書いてください");let old=teacher.level;teacher.xp+=20;if(a.length>=100&&!teacher.dna.includes("深掘り型"))teacher.dna.push("深掘り型");if(/しかし|一方|ただし|反対|反論/.test(a)&&!teacher.dna.includes("反論型"))teacher.dna.push("反論型");if(/根拠|理由|データ|具体|例/.test(a)&&!teacher.dna.includes("根拠重視"))teacher.dna.push("根拠重視");if(teacher.xp>=500&&!teacher.dna.includes("採点者型"))teacher.dna.push("採点者型");teacher.level=lev(teacher.xp);teacher.firstQuestion="一歩反論：その主張が成立しない条件・例外は？";teacher.memory.unshift({summary:`「${a.slice(0,100)}」と回答。先生から条件・例外を問い返された。`});teacher.memory=teacher.memory.slice(0,50);await save();render();$("studyResult").innerHTML=`<div class="panel"><b>🧑‍🏫 ${esc(teacher.name)}：</b>いいね。では一歩反論。</div><p>⚔️ 「その主張が成立しない条件・例外は？」</p><p>⭐ +20 XP　Lv.${teacher.level}</p>`;$("answer").value=""}catch(e){msg(e.message)}}
async function conference(){try{let r=await api("/api/conference",{method:"POST",body:JSON.stringify({topic:$("topic").value})});lastConference=r;$("conf").innerHTML=r.opinions.map(x=>`<div class="panel"><b>${esc(x.name)} — ${esc(x.field)}</b>${esc(x.opinion)}</div>`).join("")}catch(e){msg(e.message)}}
async function conferenceAnswer(){let a=$("confAnswer").value.trim();if(!a)return msg("カンファレンスへの反論を書いてください");teacher.xp+=20;if(/反論|しかし|一方|ただし|弱点/.test(a)&&!teacher.dna.includes("反論型"))teacher.dna.push("反論型");teacher.level=lev(teacher.xp);teacher.memory.unshift({summary:`カンファレンス「${$("topic").value.slice(0,50)}」に対して自分の立場を述べた。`});teacher.memory=teacher.memory.slice(0,50);await save();render();$("confResult").innerHTML="<div class='panel'><b>先生たち：</b>自分の立場だけでなく、弱点まで検討できています。⭐ +20 XP</div>"}
async function cup(){let a=$("cupAnswer").value.trim();if(!a)return msg("大会答案を書いてください");let score=40;if(a.length>=100)score+=15;if(/根拠|理由|データ|具体|例/.test(a))score+=15;if(/しかし|一方|ただし|反論|弱点|例外/.test(a))score+=20;if(/条件|比較|リスク|利益/.test(a))score+=10;score=Math.min(100,score);teacher.xp+=30;teacher.level=lev(teacher.xp);teacher.memory.unshift({summary:`CUP予選 ${score}点。大会答案を提出した。`});teacher.memory=teacher.memory.slice(0,50);await save();render();let rank=score>=90?"🌎 世界大会候補":score>=80?"🏆 全国大会進出圏":score>=70?"🥇 予選通過圏":"🌱 再挑戦";$("cupResult").innerHTML=`<div class="card"><div style="font-size:38px;font-weight:800">${score} / 100</div><h2>${rank}</h2><p>⭐ +30 XP</p><p>次の一歩反論：「支持する証拠が崩れたら、結論はどう変わる？」</p></div>`}
boot();
</script></body></html>
